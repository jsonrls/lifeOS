name: LifeOS
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  LifeKit:
    path: Packages/LifeKit
targets:
  LifeOS:
    type: application
    platform: macOS
    sources: [LifeOS]
    dependencies:
      - package: LifeKit
        product: LifeCore
      - package: LifeKit
        product: CityEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaysonreales.lifeos
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
schemes:
  LifeOS:
    build:
      targets:
        LifeOS: all
