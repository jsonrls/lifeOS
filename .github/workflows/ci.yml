name: CI
on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]
jobs:
  build:
    # shortcut: Intel pool because macos-26 (arm64) jobs never got a runner, return to macos-26 when capacity recovers
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/LifeKit
      - run: brew install xcodegen
      - run: xcodegen && xcodebuild -scheme LifeOS -destination 'platform=macOS' test
